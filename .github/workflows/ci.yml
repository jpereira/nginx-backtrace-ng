name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.distro }} / nginx ${{ matrix.nginx }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        distro: [ubuntu, debian]
        nginx: ["1.31.7", "1.26.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Run the suite
        run: make test-${{ matrix.distro }} NGINX_VERSION=${{ matrix.nginx }}
